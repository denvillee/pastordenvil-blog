# Scheduled publishing.
#
# The site is static, and an entry only appears once a build runs with its
# `publishAt` in the past. Without a scheduled build, a post banked for next
# Tuesday sits in the repo and never appears: the last push is the last build.
#
# The README has described this file since the site went up. It was never
# actually committed, so every banked post on denvillee.com has been waiting on
# somebody pushing something else. That is what this fixes.
#
# Daily rather than weekly. A weekly rebuild means a piece dated Tuesday shows
# up on Sunday, which makes `publishAt` a suggestion rather than a date. One
# build a day is a few seconds of Netlify time and keeps the dates honest.
#
# ONE THING IS STILL NEEDED, AND IT IS DENVIL'S TO DO, NOT MINE:
#   1. Netlify → Site configuration → Build & deploy → Build hooks → Add build
#      hook. Name it "Daily publish", branch main. Copy the URL it gives you.
#   2. GitHub → this repo → Settings → Secrets and variables → Actions → New
#      repository secret. Name: NETLIFY_BUILD_HOOK. Value: that URL.
# Until the secret exists the job runs and stops with a clear message rather
# than failing silently.

name: Daily build

# PARKED, 1 Sep 2026. The daily schedule is commented out on purpose.
#
# NETLIFY_BUILD_HOOK has never been set, so every scheduled run since this file
# landed has failed at the guard below and emailed Denvil a red X. Three failures
# so far, and it would have been one a day forever.
#
# Nothing real is waiting on it. The only future-dated entries in the repo are
# three files in the parked `frameworks` collection, one "Coming soon" stub, and
# one unwritten leaders placeholder. No finished piece is banked behind a date.
#
# TO TURN IT BACK ON, once the secret exists:
#   1. Netlify > Site configuration > Build & deploy > Build hooks > Add build
#      hook. Name it "Daily publish", branch main. Copy the URL.
#   2. GitHub > this repo > Settings > Secrets and variables > Actions > New
#      repository secret. Name: NETLIFY_BUILD_HOOK. Value: that URL.
#   3. Uncomment the two schedule lines below.
#
# The guard is deliberately left as `exit 1`. If this is ever scheduled again
# without the secret it should fail loudly rather than pretend to publish.

on:
  # schedule:
  #   - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Netlify build hook
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "NETLIFY_BUILD_HOOK is not set."
            echo "Add it under Settings > Secrets and variables > Actions."
            echo "Nothing was built. Scheduled posts will not appear until this is set."
            exit 1
          fi
          curl -sS -X POST -d '{}' "$HOOK"
          echo "Build requested."
