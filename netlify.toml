[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

  # LIVE as of 26 Aug 2026. The holding pattern is off: production now builds
  # the real site. To put the holding page back, set COMING_SOON = "1" under a
  # [context.production.environment] block here and push — the layout still
  # supports it, nothing else has to change.

# denvillee.com is the canonical domain. pastordenvil.com stays attached as an
# alias so old links keep working, but every request to it is sent to the real
# domain. Netlify handles www.denvillee.com -> denvillee.com on its own.
# The Reading room was renamed Bookshelf so the tab, the section heading and the
# address all say the same word. Anything already shared at the old path still lands.
# /start-here/ shipped briefly on 26 Aug and was retired the same day — the
# seven-move app-style journey belongs to the study site, not here.
# Frameworks was retired on 28 Aug. The drawings did not go with it: every essay,
# leaders piece and moment can name a diagram and render it inline, which is where
# they always read better than in a room of their own.
# The three section introductions used to have their own article URLs. They are
# now rendered in full at the top of their section page, which is the canonical
# and only copy, so the old addresses point at the section.
# The opening essay of More Than Body and Breath was published as "More Than
# Body and Breath" before that became the name of the whole series. Denvil's
# 30 Aug handoff retitles the piece "Who Do You Think You Are?", so the old
# address moves rather than breaking.
[[redirects]]
  from = "/essays/more-than-body-and-breath"
  to = "/essays/who-do-you-think-you-are/"
  status = 301
  force = true

[[redirects]]
  from = "/essays/more-than-body-and-breath/*"
  to = "/essays/who-do-you-think-you-are/"
  status = 301
  force = true

# Essay two was built and previewed as "The World Was Full of Images" before
# Denvil ruled on 30 Aug that a post's title must match its artwork. The card
# reads "A World of Images and Idols", so the title moved to meet it and the
# address moves with the title. Nothing was ever published at the old one, but
# the preview link was shared, so it points at the real page rather than a 404.
[[redirects]]
  from = "/essays/the-world-was-full-of-images"
  to = "/essays/a-world-of-images-and-idols/"
  status = 301
  force = true

[[redirects]]
  from = "/essays/the-world-was-full-of-images/*"
  to = "/essays/a-world-of-images-and-idols/"
  status = 301
  force = true

[[redirects]]
  from = "/essays/why-this-exists"
  to = "/essays/"
  status = 301
  force = true

[[redirects]]
  from = "/essays/why-this-exists/*"
  to = "/essays/"
  status = 301
  force = true

[[redirects]]
  from = "/leaders/why-this-exists"
  to = "/leaders/"
  status = 301
  force = true

[[redirects]]
  from = "/leaders/why-this-exists/*"
  to = "/leaders/"
  status = 301
  force = true

[[redirects]]
  from = "/moments/why-this-exists"
  to = "/moments/"
  status = 301
  force = true

[[redirects]]
  from = "/moments/why-this-exists/*"
  to = "/moments/"
  status = 301
  force = true

[[redirects]]
  from = "/frameworks"
  to = "/essays/"
  status = 301
  force = true

[[redirects]]
  from = "/frameworks/*"
  to = "/essays/"
  status = 301
  force = true

[[redirects]]
  from = "/start-here/*"
  to = "/studies/"
  status = 301
  force = true

[[redirects]]
  from = "/reading"
  to = "/bookshelf/"
  status = 301
  force = true

[[redirects]]
  from = "/reading/*"
  to = "/bookshelf/"
  status = 301
  force = true

[[redirects]]
  from = "https://pastordenvil.com/*"
  to = "https://denvillee.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://i.ytimg.com; script-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; form-action 'self' https://app.kit.com; base-uri 'none'; object-src 'none'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /_astro/* and /fonts/* above are content-hashed by the build, so a changed
# file always arrives at a new URL and "immutable" is safe there.
# /assets/* is NOT hashed: these are hand-named files in public/, and they do
# get revised (a title card redrawn, a photograph replaced). Marking them
# immutable told every browser that had ever loaded one to keep it for a year
# and never even ask again, so a corrected image would not reach anyone who had
# already seen the old one. An hour of freshness plus ETag revalidation costs
# almost nothing (a 304 is a few bytes) and means a fix actually lands.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The CMS talks to the GitHub API and shows GitHub avatars, so /admin needs a
# looser policy than the public site. Scoped to /admin only, on purpose.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https://avatars.githubusercontent.com https://raw.githubusercontent.com; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://api.netlify.com; frame-ancestors 'none'; base-uri 'none'"
[[headers]]
  for = "/kit/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The shareables studio is private: Denvil bookmarks it, nothing links to it.
[[headers]]
  for = "/studio/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
