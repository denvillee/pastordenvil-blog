[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

  # Holding pattern. Only the Production context (pastordenvil.com) builds with
  # COMING_SOON set, so every branch deploy and deploy preview — including the
  # staging branch — always shows the real, in-progress site. To go live for
  # real, delete this [context.production.environment] block (or set the value
  # to "0") and push; no other code change is needed.
  [context.production.environment]
    COMING_SOON = "1"

# www -> apex. Netlify also 301s domain aliases to the primary domain automatically,
# which is how pastordenvil.com will redirect to denvillee.com in Phase B.
[[redirects]]
  from = "https://www.pastordenvil.com/*"
  to = "https://pastordenvil.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'; frame-src https://www.youtube-nocookie.com; form-action 'self' https://app.kit.com; base-uri 'none'; object-src 'none'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The CMS talks to the GitHub API and shows GitHub avatars, so /admin needs a
# looser policy than the public site. Scoped to /admin only, on purpose.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https://avatars.githubusercontent.com https://raw.githubusercontent.com; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://api.netlify.com; frame-ancestors 'none'; base-uri 'none'"
[[headers]]
  for = "/kit/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
