<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="denvil.lee">
  <!-- The wordmark's own letter, not an abstract mark. Cream ground so the
       shape holds in a dark tab strip as well as a light one; the period is
       the one piece of identity, so it stays blue at every size. -->
  <rect width="32" height="32" rx="6" fill="#FCF4E5"/>
  <g fill="#141210">
    <circle cx="13.2" cy="20.4" r="7.0"/>
    <rect x="17.9" y="4.6" width="3.9" height="22.6" rx="1.6"/>
  </g>
  <circle cx="13.2" cy="20.4" r="3.1" fill="#FCF4E5"/>
  <circle cx="26.0" cy="24.4" r="2.9" fill="#0A46D8"/>
</svg>
