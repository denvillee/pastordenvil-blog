# Sveltia CMS. Edits commit straight to the repo, Netlify rebuilds, the site updates.
# Nothing here is a database. Every field below writes to a real file you can read in Git.
backend:
  name: github
  repo: denvillee/pastordenvil-blog
  branch: staging
  commit_messages:
    create: 'Add {{collection}} “{{slug}}”'
    update: 'Update {{collection}} “{{slug}}”'
    delete: 'Delete {{collection}} “{{slug}}”'
    uploadMedia: 'Upload “{{path}}”'
    deleteMedia: 'Delete “{{path}}”'

site_url: https://denvillee.com
display_url: https://staging--dainty-queijadas-becadc.netlify.app
logo_url: /favicon.svg

media_folder: /public/assets/img/uploads
public_folder: /assets/img/uploads

publish_mode: simple

collections:
  # ------------------------------------------------------------------ writing
  - name: essays
    label: Essays
    description: 'Long-form writing. Each essay publishes at denvillee.com/essays/ and the newest one leads the home page. Essays in a set share a Series name and get a Part number.'
    label_singular: Essay
    folder: /src/content/essays
    create: true
    slug: '{{title}}'
    extension: md
    format: frontmatter
    preview_path: essays/{{slug}}/
    summary: '{{title}}'
    fields:
      - { label: Title, name: title, widget: string, hint: 'The web address is built from this. Two pieces in the same room with the exact same title would collide, so give each one its own title.' }
      - { label: Standfirst, name: dek, widget: text, hint: 'One or two sentences. Shows under the headline, in lists, and in link previews.' }
      - { label: Publish at, name: publishAt, widget: datetime, picker_utc: false, hint: 'Set a future date and it stays hidden until then. The daily build publishes it.' }
      - { label: Hold as draft, name: draft, widget: boolean, default: false, required: false, hint: 'On means it never publishes, whatever the date says.' }
      - { label: Series, name: series, widget: string, required: false, default: 'Now and Not Yet' }
      - { label: Part in the set, name: part, widget: number, value_type: int, required: false, hint: 'When an essay belongs to a set, its number in the set — 1, 2, 3. Leave blank for a standalone essay. The set itself is named in Series.' }
      - { label: Scripture, name: scripture, widget: string, required: false, hint: 'Free text, e.g. Acts 2:17; Mark 1:15' }
      - { label: Diagram, name: diagram, widget: select, required: false, options: ['TwoAges'], hint: 'Drops a drawing into this piece, after the heading and before your text. Leave blank for no drawing.' }
      - { label: Diagram caption, name: diagramCaption, widget: string, required: false, hint: 'One line under the drawing. Only used when a diagram is chosen.' }
      - { label: Tags, name: tags, widget: list, required: false, default: [] }
      - { label: Social image, name: ogImage, widget: image, required: false, hint: 'Optional. Leave blank to use the site default.' }
      - { label: Where this comes from, name: notes, widget: text, required: false, hint: 'Attribution block under the article. Simple HTML is allowed: <em>, <b>, <a href>.' }
      - { label: Body, name: body, widget: markdown }

  - name: leaders
    label: For Leaders
    description: 'Short, direct pieces for whoever is carrying something this week. Publishes at /leaders/. The page says Under construction until the first piece goes live — it fills itself, nothing else to switch on.'
    label_singular: For Leaders piece
    folder: /src/content/leaders
    create: true
    slug: '{{title}}'
    extension: md
    format: frontmatter
    preview_path: leaders/{{slug}}/
    fields:
      - { label: Title, name: title, widget: string, hint: 'The web address is built from this. Two pieces in the same room with the exact same title would collide, so give each one its own title.' }
      - { label: Standfirst, name: dek, widget: text }
      - { label: Publish at, name: publishAt, widget: datetime, picker_utc: false }
      - { label: Hold as draft, name: draft, widget: boolean, default: false, required: false }
      - { label: Series, name: series, widget: string, required: false, default: 'Now and Not Yet' }
      - { label: Scripture, name: scripture, widget: string, required: false }
      - { label: Diagram, name: diagram, widget: select, required: false, options: ['TwoAges'], hint: 'Drops a drawing into this piece, after the heading and before your text. Leave blank for no drawing.' }
      - { label: Diagram caption, name: diagramCaption, widget: string, required: false, hint: 'One line under the drawing. Only used when a diagram is chosen.' }
      - { label: Tags, name: tags, widget: list, required: false, default: [] }
      - { label: Social image, name: ogImage, widget: image, required: false }
      - { label: Where this comes from, name: notes, widget: text, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: moments
    label: Moments
    description: 'A passage, the scene retold, and what it asks of you. Publishes at /moments/. The page says Under construction until the first one goes live.'
    label_singular: Moments entry
    folder: /src/content/moments
    create: true
    slug: '{{title}}'
    extension: md
    format: frontmatter
    preview_path: moments/{{slug}}/
    fields:
      - { label: Title, name: title, widget: string, hint: 'The web address is built from this. Two pieces in the same room with the exact same title would collide, so give each one its own title.' }
      - { label: Standfirst, name: dek, widget: text }
      - { label: Publish at, name: publishAt, widget: datetime, picker_utc: false }
      - { label: Hold as draft, name: draft, widget: boolean, default: false, required: false }
      - { label: Series, name: series, widget: string, required: false, default: 'Now and Not Yet' }
      - { label: Scripture, name: scripture, widget: string, required: false }
      - { label: Diagram, name: diagram, widget: select, required: false, options: ['TwoAges'], hint: 'Drops a drawing into this piece, after the heading and before your text. Leave blank for no drawing.' }
      - { label: Diagram caption, name: diagramCaption, widget: string, required: false, hint: 'One line under the drawing. Only used when a diagram is chosen.' }
      - { label: Tags, name: tags, widget: list, required: false, default: [] }
      - { label: Social image, name: ogImage, widget: image, required: false }
      - { label: Where this comes from, name: notes, widget: text, required: false }
      - { label: 'Body — the Scripture, the Scene, the Response', name: body, widget: markdown }


  # ------------------------------------------------------------------ the rest
  - name: reading
    label: Bookshelf
    description: 'The books on /bookshelf/ and the home page shelf. Keep the synopsis to what the book or its author actually says — never an invented take. Add a cover image when one exists; without one the site draws a plain spine.'
    label_singular: Book
    folder: /src/content/reading
    create: true
    slug: '{{title}}'
    extension: md
    format: frontmatter
    # The page is /bookshelf/. The folder stays /src/content/reading so no
    # existing file has to move; the address and the tab name now agree.
    preview_path: bookshelf/
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Author, name: author, widget: string }
      - { label: Year, name: year, widget: number, value_type: int, required: false }
      - { label: Shelf status, name: shelfStatus, widget: select, options: ['now', 'shelf', 'next', 'finished'], default: 'shelf', hint: 'Only one book should be “now”.' }
      - { label: 'Shelf month', name: shelfMonth, widget: string, required: false, hint: 'Which month this book sits on, as YYYY-MM (for example 2026-09). The Bookshelf page shows the newest month; Every Book groups by it.' }
      - { label: Progress, name: progress, widget: string, required: false, hint: 'e.g. Chapter 6 of 12' }
      - { label: Spine colour, name: spine, widget: select, options: ['cobalt', 'ivy', 'brass', 'ember', 'ink'], default: 'ivy', hint: 'Only shows if there is no cover image.' }
      - { label: Cover image, name: cover, widget: image, required: false, hint: 'The book cover. If there is one it replaces the coloured spine.' }
      - { label: Order on the shelf, name: order, widget: number, value_type: int, default: 1 }
      - { label: Link, name: link, widget: string, required: false, default: '' }
      - { label: Publish at, name: publishAt, widget: datetime, picker_utc: false }
      - { label: Hold as draft, name: draft, widget: boolean, default: false, required: false }
      - { label: 'Your line about it', name: body, widget: markdown, hint: 'One or two sentences. This is the whole point of the shelf.' }

  - name: watch
    label: Watch
    description: 'Clips. Publishes at /watch/. The page says Under construction until the first clip goes live.'
    label_singular: Clip
    folder: /src/content/watch
    create: true
    slug: '{{title}}'
    extension: md
    format: frontmatter
    fields:
      - { label: Clip title, name: title, widget: string, hint: 'The big line on the clip tile, on the home page rail and the Watch page.' }
      - { label: Burned in caption, name: caption, widget: string, hint: 'The smaller line under the title on the tile. Keep it short.' }
      - { label: Length in seconds, name: durationSeconds, widget: number, value_type: int, default: 45 }
      - { label: Scripture, name: scripture, widget: string, required: false }
      - { label: Cover image, name: poster, widget: image, default: '/assets/img/clip1.jpg' }
      - { label: YouTube URL, name: youtube, widget: string, required: false, default: '' }
      - { label: TikTok URL, name: tiktok, widget: string, required: false, default: '' }
      - { label: Instagram URL, name: instagram, widget: string, required: false, default: '' }
      - { label: Publish at, name: publishAt, widget: datetime, picker_utc: false }
      - { label: Hold as draft, name: draft, widget: boolean, default: false, required: false }

  - name: pages
    label: Standing pages
    description: 'The About page and the Subscribe page.'
    label_singular: Page
    folder: /src/content/pages
    create: false
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Standfirst, name: dek, widget: text }
      - { label: Publish at, name: publishAt, widget: datetime, picker_utc: false }
      - { label: Hold as draft, name: draft, widget: boolean, default: false, required: false }
      - { label: Body, name: body, widget: markdown }

  # ------------------------------------------------------- section landing copy
  - name: landing
    label: Section landing copy
    description: 'The "Why this exists" copy on Essays, Moments, For Leaders and Bookshelf. The opening paragraph always shows on the page; everything in the body opens behind the control, so a reader coming back for what is new steps over it. One of these already exists for each section: edit them, do not add new ones.'
    label_singular: Landing page
    folder: /src/content/landing
    create: false
    extension: md
    format: frontmatter
    identifier_field: title
    fields:
      - { label: Section, name: room, widget: string, hint: 'Which section this belongs to: essays, moments, leaders or bookshelf. Do not change this; the page finds its copy by this word.' }
      - { label: Title, name: title, widget: string, hint: 'For your own reference in this list. It is not printed on the page.' }
      - { label: Opening paragraph, name: lead, widget: text, hint: 'The one paragraph that always shows, before the reader opens the rest.' }
      - { label: The rest, name: body, widget: markdown, hint: 'Opens behind "Why this exists". Put **two asterisks** around the one line you want set apart, and start a line with > to indent it as a quotation.' }

  # ------------------------------------------------------------------ site copy
  - name: settings
    label: Site copy
    description: 'Every fixed line on the site — the home page (hero and rotating phrases), section titles, buttons, empty-state lines, and the shareable card templates.'
    files:
      - name: home
        label: Home page copy
        file: /src/data/home.json
        fields:
          - { label: 'Hero, fixed words', name: heroFixed, widget: string, hint: 'The part that never changes.' }
          - { label: 'Hero, rotating phrases', name: heroRotations, widget: list, hint: 'These cycle in order. Keep them short and end each with a full stop. Five to seven works best.' }
          - { label: 'Hero, phrases on the bench', name: heroRotationsReserve, widget: list, hint: 'Not shown. Swap one up into the list above when you want a change.' }
          - { label: 'Hero, the line underneath', name: heroGospelLine, widget: text, hint: 'Use a vertical bar to break the line. Wrap a phrase in <em> to make it gold.' }
          - { label: Primary button label, name: heroPrimaryLabel, widget: string }
          - { label: Primary button link, name: heroPrimaryHref, widget: string }
          - { label: Secondary button label, name: heroSecondaryLabel, widget: string }
          - { label: Secondary button link, name: heroSecondaryHref, widget: string }
          - { label: Feature sticker — fresh, name: featureLabel, widget: string, hint: 'Shown on the home page feature while the newest essay is less than a week old.' }
          - { label: Feature sticker — a couple of weeks on, name: featureLabelRecent, widget: string, hint: 'Replaces it automatically once that essay is 8 to 21 days old, so the page never claims "this week" about older writing.' }
          - { label: Feature sticker — older, name: featureLabelOlder, widget: string, hint: 'Used once the newest essay is over three weeks old. Nothing looks stale or wrong during a quiet stretch.' }
          - { label: Essay cadence, name: essayCadence, widget: string }
          - { label: Leaders cadence, name: leadersCadence, widget: string }
          - { label: Moments cadence, name: momentsCadence, widget: string }
          - { label: 'Watch note — under the home page clip rail', name: watchNote, widget: text, hint: 'The paragraph under the three clips on the home page. The Watch page has its own note, below.' }
          - { label: 'Watch note — bottom of the Watch page', name: watchPageNote, widget: text, hint: 'The paragraph at the bottom of the Watch page. This is the rights and hosting note, not the home page one.' }
          - { label: Reading shelf note, name: readingTie, widget: text, hint: 'Shows under the shelf in both places it appears: the home page band and the Reading page.' }
          - { label: Card kit note, name: kitNote, widget: text, hint: 'The card studio at /kit/. Off the home page now; the page still exists.' }
          # ------------------------------------------------- studies handoff card
          - { label: 'Studies card — small label', name: studiesPill, widget: string, hint: 'The little tag on the dark Studies card on the home page.' }
          - { label: 'Studies card — heading', name: studiesHeading, widget: string }
          - { label: 'Studies card — paragraph', name: studiesDek, widget: text, hint: '<b>bold</b> is allowed.' }
          - { label: 'Studies card — button', name: studiesCta, widget: string, hint: 'Sends people to grabyourbibles.com. The studies are never republished here.' }
      - name: labels
        label: Section titles
        file: /src/data/labels.json
        fields:
          # ---------------------------------------------------------------- menu
          - { label: 'Menu — Essays', name: navEssays, widget: string, hint: 'The Essays link in the top menu. Renaming it here does not change the web address.' }
          - { label: 'Menu — For Leaders', name: navLeaders, widget: string, hint: 'The For Leaders link in the top menu. Matches /leaders/.' }
          - { label: 'Menu — Moments', name: navMoments, widget: string, hint: 'The Moments link in the top menu.' }
          - { label: 'Menu — Watch', name: navWatch, widget: string, hint: 'The Watch link. Currently phone menu and footer only, until there are clips to show.' }
          - { label: 'Menu — Bookshelf', name: navReading, widget: string, hint: 'The Bookshelf link in the top menu. Matches /bookshelf/.' }
          - { label: 'Menu — Studies', name: navStudies, widget: string, hint: 'The Studies link in the top menu. Matches /studies/, which hands off to grabyourbibles.com.' }
          - { label: 'Menu — About', name: navAbout, widget: string, hint: 'Only appears in the phone menu, not the desktop bar.' }
          - { label: 'Menu — Speaking', name: navSpeaking, widget: string, hint: 'Only appears in the phone menu, not the desktop bar.' }
          - { label: 'Menu — Archive', name: navArchive, widget: string, hint: 'Only appears in the phone menu, not the desktop bar.' }
          - { label: 'Menu — subscribe button', name: navCta, widget: string, hint: 'The dark button on the right of the top menu.' }

          # -------------------------------------------------------------- footer
          - { label: 'Footer — first column heading', name: footRoomsHeading, widget: string, hint: 'The heading above the first list of links in the footer.' }
          - { label: 'Footer — Essays link', name: footEssays, widget: string, hint: 'The Essays link in the footer.' }
          - { label: 'Footer — Leaders Corner link', name: footLeaders, widget: string, hint: 'The Leaders Corner link in the footer.' }
          - { label: 'Footer — Moments link', name: footMoments, widget: string, hint: 'The Moments link in the footer.' }
          - { label: 'Footer — Watch link', name: footWatch, widget: string, hint: 'The Watch link in the footer.' }
          - { label: 'Footer — Reading link', name: footReading, widget: string, hint: 'The Reading link in the footer.' }
          - { label: 'Footer link — Studies', name: footStudies, widget: string }
          - { label: 'Footer — Archive link', name: footArchive, widget: string, hint: 'The Archive link in the footer.' }
          - { label: 'Footer — second column heading', name: footElsewhereHeading, widget: string, hint: 'The heading above the About / Speaking / Subscribe column.' }
          - { label: 'Footer — About link', name: footAbout, widget: string, hint: 'The About link in the footer.' }
          - { label: 'Footer — Speaking link', name: footSpeaking, widget: string, hint: 'The Speaking link in the footer.' }
          - { label: 'Footer — subscribe link', name: footSubscribe, widget: string, hint: 'The Subscribe link in the footer.' }
          - { label: 'Footer — RSS link', name: footRss, widget: string, hint: 'The RSS link in the footer.' }

          # ----------------------------------------------------- home page bands
          - { label: 'Home — feature sticker on the essay', name: homeFeaturePill, widget: string, hint: 'The small tag on the big feature essay near the top of the home page.' }
          - { label: 'Home — feature essay link', name: homeFeatureReadLink, widget: string, hint: 'The link under the feature essay. The arrow after it is added automatically.' }
          - { label: 'Home — tag on the essay card', name: homeStreamEssayTag, widget: string, hint: 'The small tag on the first of the three cards in the “Three things every week” band.' }
          - { label: 'Home — tag on the Leaders Corner card', name: homeStreamLeadersTag, widget: string, hint: 'The small tag on the second of the three cards.' }
          - { label: 'Home — tag on the Moments card', name: homeStreamMomentsTag, widget: string, hint: 'The small tag on the third of the three cards.' }
          - { label: 'Room tag — the essay room', name: roomEssayTag, widget: string, hint: 'The small tag on top of every piece in this room, and on the Archive page. Renaming it here renames it in both places at once.' }
          - { label: 'Room tag — Leaders Corner', name: roomLeadersTag, widget: string, hint: 'The same tag, for the Leaders Corner room.' }
          - { label: 'Room tag — Moments', name: roomMomentsTag, widget: string, hint: 'The same tag, for the Moments room.' }
          - { label: 'Home — Watch heading', name: homeWatchHeading, widget: string, hint: 'The heading above the video clips on the home page.' }
          - { label: 'Home — Watch small line', name: homeWatchLabel, widget: string, hint: 'The small line beside that heading. Type &middot; for the dot between phrases.' }
          - { label: 'Home — card kit heading', name: homeKitHeading, widget: string, hint: 'The heading above the six shareable card templates.' }
          - { label: 'Home — card kit small line', name: homeKitLabel, widget: string, hint: 'The small line beside that heading. Type &middot; for the dot between phrases.' }
          - { label: 'Home — card studio link', name: homeKitLink, widget: string, hint: 'The link at the end of the card kit note. Type &rarr; for the arrow.' }

          # -------------------------------------------------- reading shelf band
          - { label: 'Reading shelf — heading', name: readingHeading, widget: string, hint: 'Used in two places: the shelf band on the home page and the Reading page.' }
          - { label: 'Bookshelf page — standfirst', name: readingDek, widget: text, hint: 'Used in Google results and link previews for the Bookshelf page.' }
          - { label: 'Bookshelf page — subtitle', name: readingSubtitle, widget: text, hint: 'The one line under the heading on the Bookshelf page. The longer piece about why the room exists is under Section landing copy.' }
          - { label: 'Studies page — subtitle', name: studiesSubtitle, widget: text, hint: 'The one line under the heading on the Studies page. The longer piece about why the studies exist lives on grabyourbibles.com.' }
          - { label: 'Reading shelf — small line', name: readingLabel, widget: string, hint: 'The small line beside that heading, in both places.' }
          - { label: 'Reading shelf — “now reading” label', name: readingNowLabel, widget: string, hint: 'The little label above the book you are currently reading.' }
          - { label: 'Reading shelf — empty message', name: readingEmpty, widget: text, hint: 'Only shows if there are no books on the shelf at all.' }

          # ------------------------------------------------------- Essays page
          - { label: 'Essays page — heading', name: essaysHeading, widget: string, hint: 'The big heading on the Essays page. Also used in the browser tab title.' }
          - { label: 'Essays page — subtitle', name: essaysSubtitle, widget: text, hint: 'The one line under the heading on the Essays page. The longer piece about why the room exists is under Section landing copy.' }
          - { label: 'Essays page — standfirst', name: essaysDek, widget: text, hint: 'The short line on the home page card. Also used in Google results and link previews.' }
          - { label: 'Essays page — empty message', name: essaysEmpty, widget: text, hint: 'Shows on the Essays page while nothing is published there yet.' }

          # ----------------------------------------------- Leaders Corner page
          - { label: 'Leaders Corner page — heading', name: leadersHeading, widget: string, hint: 'The big heading on the Leaders Corner page. Also used in the browser tab title.' }
          - { label: 'Leaders Corner page — subtitle', name: leadersSubtitle, widget: text, hint: 'The one line under the heading on the For Leaders page. The longer piece about why the room exists is under Section landing copy.' }
          - { label: 'Leaders Corner page — standfirst', name: leadersDek, widget: text, hint: 'The short line on the home page card. Also used in Google results and link previews.' }
          - { label: 'Leaders Corner page — empty message', name: leadersEmpty, widget: text, hint: 'Shows on the Leaders Corner page while nothing is published there yet.' }

          # ------------------------------------------------------ Moments page
          - { label: 'Moments page — heading', name: momentsHeading, widget: string, hint: 'The big heading on the Moments page. Also used in the browser tab title.' }
          - { label: 'Moments page — subtitle', name: momentsSubtitle, widget: text, hint: 'The one line under the heading on the Moments page. The longer piece about why the room exists is under Section landing copy.' }
          - { label: 'Moments page — standfirst', name: momentsDek, widget: text, hint: 'The short line on the home page card. Also used in Google results and link previews.' }
          - { label: 'Moments page — empty message', name: momentsEmpty, widget: text, hint: 'Shows on the Moments page while nothing is published there yet.' }


          # -------------------------------------------------------- Watch page
          - { label: 'Watch page — heading', name: watchHeading, widget: string, hint: 'The big heading on the Watch page. Also used in the browser tab title.' }
          - { label: 'Watch page — standfirst', name: watchDek, widget: text, hint: 'Not shown on the page itself. This is the sentence Google and link previews use.' }
          - { label: 'Watch page — empty message', name: watchEmpty, widget: text, hint: 'Shows on the Watch page while there are no clips yet.' }

          # ------------------------------------------------------ Archive page
          - { label: 'Archive page — heading', name: archiveHeading, widget: string, hint: 'The big heading on the Archive page. Also used in the browser tab title.' }
          - { label: 'Archive page — standfirst', name: archiveDek, widget: text, hint: 'Not shown on the page itself. This is the sentence Google and link previews use.' }
          - { label: 'Archive page — empty message', name: archiveEmpty, widget: text, hint: 'Shows on the Archive page while nothing at all is published.' }

          # ------------------------------------------------- inside every piece
          - { label: 'Article — week idea label', name: articleIdeaLabel, widget: string, hint: 'The little label above the one sentence idea at the top of every piece.' }
          - { label: 'Article — attribution heading', name: articleNotesHeading, widget: string, hint: 'The heading above the “where this comes from” credits under every piece.' }
          - { label: 'Article — share label', name: articleShareLabel, widget: string, hint: 'The word before the Facebook / X / Email / Copy link row.' }

          # ---------------------------------------------------- standing pages
          - { label: 'About page — small line', name: aboutLabel, widget: string, hint: 'The small line beside the heading on the About page.' }
          - { label: 'Speaking page — small line', name: speakingLabel, widget: string, hint: 'The small line beside the heading on the Speaking page.' }
          - { label: 'Subscribe page — small line', name: subscribeLabel, widget: string, hint: 'The small line beside the heading on the Subscribe page. Type &middot; for the dot.' }
          - { label: 'Page not found — headline', name: notFoundHeading, widget: string, hint: 'The big line people see when a web address does not exist.' }
          - { label: 'Page not found — paragraph', name: notFoundBody, widget: text, hint: 'The sentence under it. Links are allowed, e.g. <a href="/essays/">essays</a>.' }

          # ------------------------------------------- “why it is built this way”
          - { label: 'Show the “Why it is built this way” band', name: showDesignNotes, widget: boolean, default: true, hint: 'Off hides the whole “Why it is built this way” band from the bottom of the home page. It is written about the site rather than for the reader, so turn it off once the site speaks for itself.' }
          - { label: 'Design notes — heading', name: designNotesHeading, widget: string, hint: 'The heading of that band.' }
          - { label: 'Design notes — small line', name: designNotesLabel, widget: string, hint: 'The small line beside that heading.' }
          - { label: 'Design notes — note 1 heading', name: designNote1Heading, widget: string, hint: 'First of the four notes. <b>bold</b> is allowed.' }
          - { label: 'Design notes — note 1 paragraph', name: designNote1Body, widget: text, hint: '<b>bold</b> is allowed.' }
          - { label: 'Design notes — note 2 heading', name: designNote2Heading, widget: string, hint: 'Second of the four notes. <b>bold</b> is allowed.' }
          - { label: 'Design notes — note 2 paragraph', name: designNote2Body, widget: text, hint: '<b>bold</b> is allowed.' }
          - { label: 'Design notes — note 3 heading', name: designNote3Heading, widget: string, hint: 'Third of the four notes. <b>bold</b> is allowed.' }
          - { label: 'Design notes — note 3 paragraph', name: designNote3Body, widget: text, hint: '<b>bold</b> is allowed.' }
          - { label: 'Design notes — note 4 heading', name: designNote4Heading, widget: string, hint: 'Fourth of the four notes. <b>bold</b> is allowed.' }
          - { label: 'Design notes — note 4 paragraph', name: designNote4Body, widget: text, hint: '<b>bold</b> is allowed.' }
      - name: site
        label: Site wide copy
        file: /src/data/site.json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Meta description, name: metaDescription, widget: text }
          - { label: Footer blurb, name: footerBlurb, widget: text }
          - { label: Footer line, name: footerLine, widget: string }
